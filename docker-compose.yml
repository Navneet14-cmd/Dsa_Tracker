# Local Postgres for development and tests.
#   docker compose up -d db      (or: npm run db:up)
# Creates two databases: dsatracker (dev) and dsatracker_test (integration tests).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dsa
      POSTGRES_PASSWORD: dsa
      POSTGRES_DB: dsatracker
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dsa-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsa -d dsatracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dsa-pgdata:
